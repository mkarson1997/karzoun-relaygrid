name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: .NET 10 build and deterministic tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/RelayGrid.Tests/RelayGrid.Tests.csproj
      - name: Build with warnings as errors
        run: dotnet build tests/RelayGrid.Tests/RelayGrid.Tests.csproj -c Release --no-restore -warnaserror
      - name: Run deterministic runtime suite
        run: dotnet run --project tests/RelayGrid.Tests/RelayGrid.Tests.csproj -c Release --no-build

  postgres-integration:
    name: PostgreSQL Testcontainers integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore from committed lock files
        run: dotnet restore tests/RelayGrid.Postgres.Tests/RelayGrid.Postgres.Tests.csproj --locked-mode
      - name: Build durable layer
        run: dotnet build tests/RelayGrid.Postgres.Tests/RelayGrid.Postgres.Tests.csproj -c Release --no-restore -warnaserror
      - name: Run PostgreSQL integration suite
        run: dotnet run --project tests/RelayGrid.Postgres.Tests/RelayGrid.Postgres.Tests.csproj -c Release --no-build

  gate:
    name: CI Gate
    if: always()
    needs: [build-test, postgres-integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required jobs
        if: needs.build-test.result != 'success' || needs.postgres-integration.result != 'success'
        run: exit 1
      - name: Confirm green build
        run: echo "RelayGrid CI gate is green."
