name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Directory.Build.props"
      - "src/RelayGrid/**"
      - "src/RelayGrid.Postgres/**"
      - "README.md"
      - "RELEASE_NOTES.md"

permissions:
  contents: read

jobs:
  package:
    name: Release package validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-pr.${{ github.event.pull_request.number }}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Package version: ${VERSION}"

      - name: Restore from committed lock files
        run: dotnet restore tests/RelayGrid.Postgres.Tests/RelayGrid.Postgres.Tests.csproj --locked-mode

      - name: Build release graph with warnings as errors
        run: dotnet build tests/RelayGrid.Postgres.Tests/RelayGrid.Postgres.Tests.csproj -c Release --no-restore -warnaserror

      - name: Pack core and PostgreSQL packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet pack src/RelayGrid/RelayGrid.csproj \
            -c Release \
            --no-restore \
            -p:PackageVersion="${VERSION}" \
            -p:ContinuousIntegrationBuild=true \
            -o artifacts
          dotnet pack src/RelayGrid.Postgres/RelayGrid.Postgres.csproj \
            -c Release \
            --no-restore \
            -p:PackageVersion="${VERSION}" \
            -p:ContinuousIntegrationBuild=true \
            -o artifacts

      - name: Verify package set and generate SHA-256 manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "artifacts/Karzoun.RelayGrid.${VERSION}.nupkg"
          test -f "artifacts/Karzoun.RelayGrid.${VERSION}.snupkg"
          test -f "artifacts/Karzoun.RelayGrid.Postgres.${VERSION}.nupkg"
          test -f "artifacts/Karzoun.RelayGrid.Postgres.${VERSION}.snupkg"

          unzip -l "artifacts/Karzoun.RelayGrid.${VERSION}.nupkg"
          unzip -l "artifacts/Karzoun.RelayGrid.Postgres.${VERSION}.nupkg"

          (
            cd artifacts
            sha256sum \
              "Karzoun.RelayGrid.${VERSION}.nupkg" \
              "Karzoun.RelayGrid.${VERSION}.snupkg" \
              "Karzoun.RelayGrid.Postgres.${VERSION}.nupkg" \
              "Karzoun.RelayGrid.Postgres.${VERSION}.snupkg" \
              > SHA256SUMS.txt
          )
          cat artifacts/SHA256SUMS.txt

      - name: Upload reviewed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relaygrid-release-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release and NuGet packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download reviewed release artifacts
        uses: actions/download-artifact@v5
        with:
          name: relaygrid-release-${{ steps.version.outputs.version }}
          path: artifacts

      - name: Verify checksum manifest before publish
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS.txt

      - name: Publish core package to GitHub Packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/Karzoun.RelayGrid.${VERSION}.nupkg" \
            --source "https://nuget.pkg.github.com/mkarson1997/index.json" \
            --api-key "${GITHUB_TOKEN}" \
            --skip-duplicate

      - name: Publish PostgreSQL package to GitHub Packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/Karzoun.RelayGrid.Postgres.${VERSION}.nupkg" \
            --source "https://nuget.pkg.github.com/mkarson1997/index.json" \
            --api-key "${GITHUB_TOKEN}" \
            --skip-duplicate

      - name: Attest primary NuGet packages
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/*.nupkg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "Karzoun RelayGrid ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
